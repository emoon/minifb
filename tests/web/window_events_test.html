<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MiniFB window event contract test</title>
    <script src="./window_events_test.js"></script>
</head>
<body style="background: #222; color: #bbb; font-family: sans-serif">
    <main style="display: flex; flex-direction: column; align-items: center">
        <h1>MiniFB window event contract test</h1>
        <p>Open the browser developer console, then perform the printed steps. The canvas takes its size from the browser window, so resizing the window resizes the canvas.</p>
        <canvas id="MiniFB window event contract test"
                style="background: #000; width: min(90vw, 93vh); aspect-ratio: 4 / 3"
                tabindex="0"></canvas>
    </main>
    <script>
        async function init() {
            await window_events_test();
        }
        init();
    </script>
</body>
