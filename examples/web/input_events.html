<html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <script src="./input_events.js"></script>
</head>
<body style="background: #222; color: #bbbbbb">
<div style="display: flex; flex-direction: column; align-items: center;">
    <h2>Input Events Test</h2>
    <p>Open the development console to see events.</p>
    <!-- A relative canvas size is what makes the window resizable on the web:
         the drawing buffer follows this layout box. This example keeps a fixed
         4:3 framebuffer, so the canvas declares the same ratio to avoid stretching.
         The vh limit is derived from it: at 4:3 the height is 75% of the width,
         so capping the height at 70vh caps the width at 70 / 0.75 = 93vh. -->
    <canvas id="Input Events Test" style="background: #000; width: min(90vw, 93vh); aspect-ratio: 4 / 3"></canvas>
</div>
<script>
    async function init() { await input_events() }
    init();
</script>
</body>
</html>
